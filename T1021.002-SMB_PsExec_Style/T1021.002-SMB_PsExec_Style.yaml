executors:
  - name: psh
    platform: windows
    command: |
      if (-not (Test-Path "C:\Temp\LM-challenges")) { git clone https://github.com/hacktifytechnologies/Lateral-Movement "C:\Temp\LM-challenges" } else { git -C "C:\Temp\LM-challenges" pull --quiet }
      powershell -ExecutionPolicy Bypass -File "C:\Temp\LM-challenges\T1021.002-SMB_PsExec_Style\setup.ps1"
    payloads: []
    parsers: []
